<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#201F1C">
  <meta name="color-scheme" content="light dark">
  <title>Мои финансы</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Скрипт для мгновенного применения темы до отрисовки -->
  <script>
    (function() {
      const theme = localStorage.getItem('appTheme') || 'system';
      if (theme === 'dark') document.documentElement.classList.add('theme-dark');
      else if (theme === 'light') document.documentElement.classList.add('theme-light');
    })();
  </script>

  <style>
    html { background:#F6F4ED; }
    html.theme-dark { background:#201F1C; }
    @media(prefers-color-scheme:dark){ html:not(.theme-light){ background:#201F1C; } }
    body.booting{ visibility:hidden; }
  </style>

  <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg">
  <link rel="apple-touch-icon" href="%BASE_URL%icons/icon.svg">
</head>
<body class="booting">

  <div id="app">

    <header class="app-header">
      <div style="display:flex; flex-direction:column;">
        <h1>Мои финансы</h1>
        <p class="subtitle">v4.3 — Schema v14</p>
      </div>
      <button class="settings-icon-btn" data-tab="settings" aria-label="Настройки">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </header>

    <nav class="tabs" aria-label="Основная навигация">
      <button class="tab" data-tab="plan">План</button>
      <button class="tab" data-tab="budget">Бюджет</button>
      <button class="tab" data-tab="calendar">Календарь</button>
      <button class="tab" data-tab="statistics">Статистика</button>
    </nav>

    <main id="screen" class="screen" aria-live="polite"></main>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
